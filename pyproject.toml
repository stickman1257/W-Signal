[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "w-signal"
version = "0.1.0"
description = "Water and income data analysis for community care"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.3.5",
    "pandas==2.2.3",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "catboost==1.2.10",
    "matplotlib==3.11.2",
    "joblib==1.6.0",
]

[tool.setuptools]
packages = []
